nodes:
  - name: zeus_one # 节点名称
    addr: localhost # 节点IP地址
    port: 6379  # 节点端口地址
    type: SINGLE # 正常类型 单节点
    cluster-id: -1 # 集群ID
    heartbeat-interval: -1 # 心跳检测间隔时间
    failure-detection-timeout: -1 # 故障检测超时时间
    max-connections: 10 # 最大连接数

aof:
  enable: false # 是否开启
  filename: zeus.aof # 文件名
  preallocate-size: 1048576 # 文件预分配大小 1 * 1024 * 1024 1MB
  flush-interval: 1000 # 刷盘间隔 单位 MS
  large-cmd-threshold: 524288 # 大key大小 512 * 1024 0.5 MB
  backpressure-threshold: 62911456 # 背压阈值设置 6 * 1024 * 1024 6MB
  queue-size: 1000 # 阻塞队列长度
  min-batch-size: 16 # 最小批次大小
  max-batch-size: 50 # 最大批次大小
  min-batch-timeout: 2 # 最小批次间隔
  max-batch-timeout: 10 # 最大批次间隔
zdb:
  enable: false # 是否开启