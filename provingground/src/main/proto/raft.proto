syntax = "proto3";

package com.example.raft;

// 1. 领导者选举
message RequestVoteRequest {
  int32 term = 1;         // 候选人的任期号
  string candidateId = 2; // 请求选票的候选人ID
  int32 lastLogIndex = 3; // 候选人的最后日志条目的索引值
  int32 lastLogTerm = 4;  // 候选人最后日志条目的任期号
}

message RequestVoteResponse {
  int32 term = 1;         // 当前任期号
  bool voteGranted = 2;   // 是否授予选票
}

// 2. 日志复制
message AppendEntriesRequest {
  int32 term = 1;         // 领导者的任期号
  string leaderId = 2;    // 领导者ID
  int32 prevLogIndex = 3; // 前一个日志条目的索引
  int32 prevLogTerm = 4;  // 前一个日志条目的任期
  LogEntry entry = 5;     // 要复制的日志条目（为空表示心跳）
  int32 leaderCommit = 6; // 领导者的提交索引
}

message LogEntry {
  int32 term = 1;         // 日志条目的任期
  string command = 2;     // 日志命令（简化为字符串）
}

message AppendEntriesResponse {
  int32 term = 1;         // 当前任期号
  bool success = 2;       // 是否成功
}

// 3. 服务定义
service RaftService {
  rpc RequestVote (RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse);
}